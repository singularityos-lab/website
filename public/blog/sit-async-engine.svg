<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#000"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#888"/>
    </marker>
  </defs>
  <g font-family="Montserrat, Inter, sans-serif" fill="#e0e0e0" font-size="17">
    <rect x="60" y="40" width="500" height="110" rx="14" fill="none" stroke="#888" stroke-width="2"/>
    <text x="310" y="82" text-anchor="middle" font-weight="600">GTK itself</text>
    <text x="310" y="112" text-anchor="middle" font-size="14" fill="#888">images, icons, lists, folders, file chooser,</text>
    <text x="310" y="132" text-anchor="middle" font-size="14" fill="#888">recent files, printing, clipboard, GIO files</text>
    <rect x="640" y="40" width="500" height="110" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="890" y="82" text-anchor="middle" font-weight="600">Application code</text>
    <text x="890" y="112" text-anchor="middle" font-size="14" fill="#888">SitTask, SitFuture, SitStream, SitChannel</text>
    <text x="890" y="132" text-anchor="middle" font-size="14" fill="#888">or Singularity.Async in Vala</text>

    <line x1="310" y1="150" x2="310" y2="196" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
    <line x1="890" y1="150" x2="890" y2="196" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

    <rect x="60" y="200" width="1080" height="230" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
    <text x="90" y="238" font-weight="600" font-size="20">One scheduler per process</text>
    <text x="90" y="264" font-size="14" fill="#888">each job has a QoS class and a scope; destroying the scope cancels its pending jobs</text>

    <g font-size="15">
      <rect x="90" y="286" width="240" height="56" rx="10" fill="none" stroke="#e0e0e0" stroke-width="2"/>
      <text x="210" y="320" text-anchor="middle">interactive</text>
      <rect x="350" y="286" width="240" height="56" rx="10" fill="none" stroke="#bbb" stroke-width="2"/>
      <text x="470" y="320" text-anchor="middle">user</text>
      <rect x="610" y="286" width="240" height="56" rx="10" fill="none" stroke="#888" stroke-width="2"/>
      <text x="730" y="320" text-anchor="middle">utility</text>
      <rect x="870" y="286" width="240" height="56" rx="10" fill="none" stroke="#555" stroke-width="2"/>
      <text x="990" y="320" text-anchor="middle">background</text>
    </g>
    <g font-size="14" fill="#888">
      <text x="90" y="378">one queue per CPU core, with work stealing between workers</text>
      <text x="90" y="404">local file reads through io_uring, thread pool fallback</text>
      <text x="870" y="370">SCHED_IDLE and idle I/O</text>
      <text x="870" y="392">priority, registered with</text>
      <text x="870" y="414">sinty-schedd</text>
    </g>

    <line x1="600" y1="430" x2="600" y2="476" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

    <rect x="60" y="480" width="1080" height="90" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <text x="90" y="518" font-weight="600">Frame-paced delivery</text>
    <text x="90" y="546" font-size="14" fill="#888">completions are drained after the paint phase with a 2 ms budget per frame</text>

    <line x1="600" y1="570" x2="600" y2="616" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="620" width="1080" height="56" rx="14" fill="none" stroke="#888" stroke-width="2"/>
    <text x="600" y="654" text-anchor="middle">main thread: input, layout and drawing</text>
  </g>
</svg>
