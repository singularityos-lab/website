<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670">
<rect width="1200" height="670" fill="#000"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#888"/></marker></defs>
<g font-family="Montserrat, Inter, sans-serif" fill="#e0e0e0" font-size="17">
<text x="60" y="52" font-weight="600" font-size="22">Layers</text>
<text x="60" y="80" fill="#888" font-size="15">Solid arrows: linked at build time. Dashed: resolved at runtime when present.</text>
