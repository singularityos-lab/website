<text x="600.0" y="139.0" text-anchor="middle" font-weight="600" font-size="17">Singularity applications, the shell, Settings, portals</text>
<text x="600.0" y="163.0" text-anchor="middle" font-size="14" fill="#888">written in Vala, UI described in .vetro</text>
<line x1="330" y1="180" x2="330" y2="226" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="870" y1="180" x2="870" y2="226" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="230" width="520" height="120" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
<text x="320.0" y="284.0" text-anchor="middle" font-weight="600" font-size="17">libsingularity</text>
<text x="320.0" y="308.0" text-anchor="middle" font-size="14" fill="#888">application framework, widgets, motion,</text>
<text x="320.0" y="328.0" text-anchor="middle" font-size="14" fill="#888">async, documents, media, accounts</text>
<rect x="620" y="230" width="520" height="120" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
<text x="880.0" y="284.0" text-anchor="middle" font-weight="600" font-size="17">libsingularity-system</text>
<text x="880.0" y="308.0" text-anchor="middle" font-size="14" fill="#888">managers for audio, power, network,</text>
<text x="880.0" y="328.0" text-anchor="middle" font-size="14" fill="#888">Bluetooth, displays, updates, sandboxes</text>
<line x1="870" y1="350" x2="870" y2="396" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<rect x="620" y="400" width="520" height="100" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
<text x="880.0" y="444.0" text-anchor="middle" font-weight="600" font-size="17">libsinty-system-core</text>
<text x="880.0" y="468.0" text-anchor="middle" font-size="14" fill="#888">Zig, flat C ABI (sinty-system/v1.h),</text>
<text x="880.0" y="488.0" text-anchor="middle" font-size="14" fill="#888">Vala and Go bindings</text>
<line x1="330" y1="350" x2="330" y2="536" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
