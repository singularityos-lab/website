<text x="185.0" y="603.0" text-anchor="middle" font-size="14" fill="#888">widgets, rendering</text>
<rect x="330" y="540" width="250" height="90" rx="14" fill="none" stroke="#888" stroke-width="2"/>
<text x="455.0" y="579.0" text-anchor="middle" font-weight="600" font-size="17">Sinty Compute</text>
<text x="455.0" y="603.0" text-anchor="middle" font-size="14" fill="#888">libsintycompute.so.0</text>
