<rect x="620" y="560" width="250" height="70" rx="14" fill="none" stroke="#888" stroke-width="2"/>
<text x="745.0" y="589.0" text-anchor="middle" font-weight="600" font-size="17">Sinty daemons</text>
<text x="745.0" y="613.0" text-anchor="middle" font-size="14" fill="#888">Go: disks, firewall, network</text>
<line x1="745" y1="560" x2="745" y2="504" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<rect x="890" y="560" width="250" height="70" rx="14" fill="none" stroke="#555" stroke-width="2"/>
<text x="1015.0" y="589.0" text-anchor="middle" font-weight="600" font-size="17">Linux kernel</text>
<text x="1015.0" y="613.0" text-anchor="middle" font-size="14" fill="#888">sysfs, netlink, ioctls</text>
<line x1="1015" y1="500" x2="1015" y2="556" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

