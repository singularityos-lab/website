<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410">
<rect width="1200" height="410" fill="#000"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#888"/></marker></defs>
<g font-family="Montserrat, Inter, sans-serif" fill="#e0e0e0">
<text x="60" y="52" font-size="22" fill="#e0e0e0" text-anchor="start" font-weight="600">Optional components, resolved once per process</text>
<text x="60" y="80" font-size="15" fill="#888" text-anchor="start">The same binary runs on stock GTK, on SIT and on Sinty OS; each path is selected at first use.</text>
<rect x="60" y="110" width="340" height="100" rx="14" fill="#fff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
<text x="230" y="146" font-size="17" fill="#e0e0e0" text-anchor="middle" font-weight="600">SIT symbols</text>
<text x="230" y="172" font-size="14" fill="#888" text-anchor="middle">dlsym in the running process:</text>
<text x="230" y="192" font-size="14" fill="#888" text-anchor="middle">sit_task_run, sit_widget_set_glass</text>
<line x1="142" y1="210" x2="142" y2="262" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="318" y1="210" x2="318" y2="262" stroke="#888" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
<text x="134" y="242" font-size="13" fill="#888" text-anchor="end">present</text>
<text x="326" y="242" font-size="13" fill="#888" text-anchor="start">absent</text>
<rect x="60" y="266" width="164" height="112" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
<text x="142" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">native</text>
<text x="142" y="326" font-size="12.5" fill="#888" text-anchor="middle">SIT scheduler, glass,</text>
<text x="142" y="346" font-size="12.5" fill="#888" text-anchor="middle">visual transforms, border</text>
<rect x="236" y="266" width="164" height="112" rx="14" fill="none" stroke="#555" stroke-width="2"/>
<text x="318" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">fallback</text>
<text x="318" y="326" font-size="12.5" fill="#888" text-anchor="middle">GTask pool; background</text>
<text x="318" y="346" font-size="12.5" fill="#888" text-anchor="middle">at nice 19, idle I/O</text>
<rect x="430" y="110" width="340" height="100" rx="14" fill="#fff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
<text x="600" y="146" font-size="17" fill="#e0e0e0" text-anchor="middle" font-weight="600">Sinty Compute</text>
<text x="600" y="172" font-size="14" fill="#888" text-anchor="middle">dlopen of</text>
<text x="600" y="192" font-size="14" fill="#888" text-anchor="middle">libsintycompute.so.0</text>
<line x1="512" y1="210" x2="512" y2="262" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="688" y1="210" x2="688" y2="262" stroke="#888" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
<text x="504" y="242" font-size="13" fill="#888" text-anchor="end">present</text>
<text x="696" y="242" font-size="13" fill="#888" text-anchor="start">absent</text>
<rect x="430" y="266" width="164" height="112" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
<text x="512" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">native</text>
<text x="512" y="326" font-size="12.5" fill="#888" text-anchor="middle">results reused across</text>
<text x="512" y="346" font-size="12.5" fill="#888" text-anchor="middle">processes and threads</text>
<rect x="606" y="266" width="164" height="112" rx="14" fill="none" stroke="#555" stroke-width="2"/>
<text x="688" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">fallback</text>
<text x="688" y="326" font-size="12.5" fill="#888" text-anchor="middle">producer runs directly,</text>
<text x="688" y="346" font-size="12.5" fill="#888" text-anchor="middle">nothing is cached</text>
<rect x="800" y="110" width="340" height="100" rx="14" fill="#fff" fill-opacity="0.05" stroke="#e0e0e0" stroke-width="2"/>
<text x="970" y="146" font-size="17" fill="#e0e0e0" text-anchor="middle" font-weight="600">System core</text>
<text x="970" y="172" font-size="14" fill="#888" text-anchor="middle">dlopen of</text>
<text x="970" y="192" font-size="14" fill="#888" text-anchor="middle">libsinty-system-core.so.1</text>
<line x1="882" y1="210" x2="882" y2="262" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
<line x1="1058" y1="210" x2="1058" y2="262" stroke="#888" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
<text x="874" y="242" font-size="13" fill="#888" text-anchor="end">present</text>
<text x="1066" y="242" font-size="13" fill="#888" text-anchor="start">absent</text>
<rect x="800" y="266" width="164" height="112" rx="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
<text x="882" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">native</text>
<text x="882" y="326" font-size="12.5" fill="#888" text-anchor="middle">PipeWire graph, processes,</text>
<text x="882" y="346" font-size="12.5" fill="#888" text-anchor="middle">sensors via the C ABI</text>
<rect x="976" y="266" width="164" height="112" rx="14" fill="none" stroke="#555" stroke-width="2"/>
<text x="1058" y="298" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="600">fallback</text>
<text x="1058" y="326" font-size="12.5" fill="#888" text-anchor="middle">the feature reports</text>
<text x="1058" y="346" font-size="12.5" fill="#888" text-anchor="middle">itself unavailable</text>
</g>
</svg>
