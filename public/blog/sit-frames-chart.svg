<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <rect width="1200" height="660" fill="#000"/>
  <g font-family="Montserrat, Inter, sans-serif" fill="#e0e0e0" font-size="16">
    <text x="60" y="56" font-weight="600" font-size="22">Frames per second, same document and machine</text>
    <text x="60" y="84" fill="#888" font-size="15">Output at 144 Hz. Grey: before. White: current.</text>

    <g fill="#888" font-size="13" text-anchor="middle">
      <text x="380" y="124">0</text>
      <text x="580" y="124">50</text>
      <text x="780" y="124">100</text>
      <text x="980" y="124">150</text>
    </g>
    <g stroke="#222" stroke-width="1">
      <line x1="380" y1="134" x2="380" y2="616"/>
      <line x1="580" y1="134" x2="580" y2="616"/>
      <line x1="780" y1="134" x2="780" y2="616"/>
      <line x1="980" y1="134" x2="980" y2="616"/>
    </g>
    <line x1="956" y1="134" x2="956" y2="616" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="956" y="638" text-anchor="middle" fill="#888" font-size="13">144 Hz screen</text>

    <g font-size="15">
      <text x="360" y="166" text-anchor="end">Spreadsheet, wheel scroll</text>
      <rect x="380" y="150" width="200" height="14" rx="3" fill="#555"/>
      <rect x="380" y="168" width="544" height="14" rx="3" fill="#e0e0e0"/>
      <text x="590" y="162" fill="#888" font-size="13">50</text>
      <text x="934" y="180" font-size="13">136</text>

      <text x="360" y="246" text-anchor="end">Write, 39 pages</text>
      <rect x="380" y="230" width="288" height="14" rx="3" fill="#555"/>
      <rect x="380" y="248" width="624" height="14" rx="3" fill="#e0e0e0"/>
      <text x="678" y="242" fill="#888" font-size="13">72</text>
      <text x="1014" y="260" font-size="13">156</text>

      <text x="360" y="326" text-anchor="end">Keyframe, viewer</text>
      <rect x="380" y="310" width="116" height="14" rx="3" fill="#555"/>
      <rect x="380" y="328" width="652" height="14" rx="3" fill="#e0e0e0"/>
      <text x="506" y="322" fill="#888" font-size="13">29</text>
      <text x="1042" y="340" font-size="13">163</text>

      <text x="360" y="406" text-anchor="end">Atelier, full redraw</text>
      <rect x="380" y="390" width="52" height="14" rx="3" fill="#555"/>
      <rect x="380" y="408" width="652" height="14" rx="3" fill="#e0e0e0"/>
      <text x="442" y="402" fill="#888" font-size="13">13</text>
      <text x="1042" y="420" font-size="13">163</text>

      <text x="360" y="486" text-anchor="end">Draw, pan over 500 shapes</text>
      <rect x="380" y="470" width="136" height="14" rx="3" fill="#555"/>
      <rect x="380" y="488" width="488" height="14" rx="3" fill="#e0e0e0"/>
      <text x="526" y="482" fill="#888" font-size="13">34</text>
      <text x="878" y="500" font-size="13">122</text>

      <text x="360" y="566" text-anchor="end">Montage, timeline scroll</text>
      <rect x="380" y="550" width="372" height="14" rx="3" fill="#555"/>
      <rect x="380" y="568" width="524" height="14" rx="3" fill="#e0e0e0"/>
      <text x="762" y="562" fill="#888" font-size="13">93</text>
      <text x="914" y="580" font-size="13">131</text>
    </g>
  </g>
</svg>
