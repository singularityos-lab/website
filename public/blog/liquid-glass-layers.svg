<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a5a"/>
      <stop offset="0.5" stop-color="#1d4a5a"/>
      <stop offset="1" stop-color="#5a3a1d"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="#000"/>
  <g font-family="Montserrat, Inter, sans-serif" fill="#e0e0e0">
    <g transform="translate(120 520) skewX(-35) scale(1 0.42)">
      <rect width="560" height="260" rx="10" fill="url(#wall)" stroke="#888" stroke-width="2"/>
      <rect x="40" y="40" width="200" height="140" rx="6" fill="#111" stroke="#666" stroke-width="2"/>
      <rect x="300" y="70" width="220" height="150" rx="6" fill="#151515" stroke="#666" stroke-width="2"/>
    </g>
    <g transform="translate(120 410) skewX(-35) scale(1 0.42)">
      <rect width="560" height="260" rx="10" fill="url(#wall)" opacity="0.55" filter="url(#soft)"/>
      <rect width="560" height="260" rx="10" fill="none" stroke="#888" stroke-width="2"/>
    </g>
    <g transform="translate(120 300) skewX(-35) scale(1 0.42)">
      <rect width="560" height="260" rx="10" fill="none" stroke="#888" stroke-width="2"/>
      <rect x="20" y="20" width="520" height="220" rx="60" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6 8"/>
      <rect x="60" y="60" width="440" height="140" rx="30" fill="none" stroke="#555" stroke-width="2"/>
    </g>
    <g transform="translate(120 190) skewX(-35) scale(1 0.42)">
      <rect width="560" height="260" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#888" stroke-width="2"/>
      <rect x="20" y="20" width="520" height="220" rx="60" fill="none" stroke="url(#rim)" stroke-width="6"/>
    </g>
    <g transform="translate(120 80) skewX(-35) scale(1 0.42)">
      <rect width="560" height="260" rx="10" fill="none" stroke="#888" stroke-width="2"/>
      <rect x="70" y="80" width="80" height="80" rx="18" fill="#2b8fd8"/>
      <rect x="190" y="80" width="80" height="80" rx="18" fill="#e04a7a"/>
      <rect x="310" y="80" width="80" height="80" rx="18" fill="#7a5ae0"/>
      <rect x="430" y="80" width="80" height="80" rx="18" fill="#e0b23a"/>
    </g>
    <g font-size="22">
      <line x1="720" y1="138" x2="770" y2="138" stroke="#555"/>
      <text x="785" y="134" font-weight="600">5. The dock's own content</text>
      <text x="785" y="162" font-size="17" fill="#888">icons and labels, drawn by the app</text>
      <line x1="720" y1="248" x2="770" y2="248" stroke="#555"/>
      <text x="785" y="244" font-weight="600">4. Tint and rim highlight</text>
      <text x="785" y="272" font-size="17" fill="#888">a light catching the edge</text>
      <line x1="720" y1="358" x2="770" y2="358" stroke="#555"/>
      <text x="785" y="354" font-weight="600">3. Refraction near the edge</text>
      <text x="785" y="382" font-size="17" fill="#888">flat in the middle, bending at the curve</text>
      <line x1="720" y1="468" x2="770" y2="468" stroke="#555"/>
      <text x="785" y="464" font-weight="600">2. Blur and saturation</text>
      <text x="785" y="492" font-size="17" fill="#888">the backdrop, softened and made vivid</text>
      <line x1="720" y1="578" x2="770" y2="578" stroke="#555"/>
      <text x="785" y="574" font-weight="600">1. What is behind</text>
      <text x="785" y="602" font-size="17" fill="#888">wallpaper and windows, read by the compositor</text>
    </g>
  </g>
</svg>
